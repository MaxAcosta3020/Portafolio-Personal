name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-typecheck-build:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build (export estática)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://ci-example.pages.dev
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-XXXXXXXXXX
          NEXT_PUBLIC_GSC_VERIFICATION: ci-verification-token

  tests-unitarios-contenido:
    name: Pruebas de contenido
    runs-on: ubuntu-latest
    needs: lint-typecheck-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Pruebas de contenido (sin servidor)
        run: npx playwright test content.spec.ts

  tests-e2e:
    name: Pruebas E2E (Playwright)
    runs-on: ubuntu-latest
    needs: lint-typecheck-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium

      - name: Build (requerido por el webServer de Playwright)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://ci-example.pages.dev
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-XXXXXXXXXX
          NEXT_PUBLIC_GSC_VERIFICATION: ci-verification-token

      - name: Ejecutar pruebas E2E (desktop y mobile)
        run: npm test
        env:
          NEXT_PUBLIC_SITE_URL: https://ci-example.pages.dev

  audit:
    name: Auditoría de dependencias (npm audit)
    runs-on: ubuntu-latest
    needs: lint-typecheck-build
    if: github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Ejecutar npm audit (nivel minimo moderado)
        run: npm audit --audit-level=moderate
        continue-on-error: true
